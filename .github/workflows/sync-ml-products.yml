name: Radar de productos

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radar:
    if: vars.SHOP_RADAR_ENABLED == 'true' || vars.SHOP_RADAR_RESEARCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Descubrir e investigar candidatos
        run: node scripts/sync-ml-products.mjs
        env:
          SHOP_RADAR_ENABLED: ${{ vars.SHOP_RADAR_ENABLED }}
          SHOP_RADAR_RESEARCH_ENABLED: ${{ vars.SHOP_RADAR_RESEARCH_ENABLED }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_APP_SECRET: ${{ secrets.ML_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
